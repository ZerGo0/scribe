version: "3"

tasks:
  default:
    desc: Build Scribe
    cmds:
      - task: build

  build:
    desc: Build the debug executable
    cmds:
      - swift build

  test:
    desc: Run the unit test suite
    cmds:
      - |
        swift build --build-tests
        TEST_BIN_DIR=$(swift build --show-bin-path)
        mkdir -p "$TEST_BIN_DIR/PackageFrameworks"
        ditto \
          ".build/artifacts/lame-xcframework/LAME/LAME.xcframework/macos-arm64_x86_64/LAME.framework" \
          "$TEST_BIN_DIR/PackageFrameworks/LAME.framework"
        swift test --skip-build

  bundle:
    desc: Build the release app bundle
    cmds:
      - ./Scripts/build-app.sh

  install:
    desc: Build and install Scribe for everyday use
    silent: true
    cmds:
      - task: bundle
      - pkill -x Scribe || true
      - sleep 0.2
      - mkdir -p "$HOME/Applications"
      - rm -rf "$HOME/Applications/Scribe.app"
      - cp -R "dist/Scribe.app" "$HOME/Applications/Scribe.app"
      - touch "$HOME/Applications/Scribe.app"
      - open "$HOME/Applications/Scribe.app"
      - echo "Installed $HOME/Applications/Scribe.app"

  clean:
    desc: Remove SwiftPM and packaged build output
    cmds:
      - swift package clean
      - rm -rf dist
